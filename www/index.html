<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>હિસાબ</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#d9d4c7;--head:#1d2433;--headtxt:#f6f4ef;--today:#fff3c4;--tot:#e8efe6;--paytm:#1f6feb;--cash:#1a8a4a;--kharcha:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#eef0f4;--mute:#98a1b0;--line:#313846;--head:#eef0f4;--headtxt:#14171d;--today:#3a3416;--tot:#1f2b22;--paytm:#6ea8ff;--cash:#4cc27f;--kharcha:#ff8a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Gujarati","Shruti",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px}
.nav button{width:46px;height:46px;font-size:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav h1{font-size:22px;margin:0;text-align:center}
.wrap{padding:0 8px 40px;max-width:560px;margin:auto}
table{width:100%;border-collapse:collapse;background:var(--card);table-layout:fixed}
th,td{border:1px solid var(--line);padding:0;text-align:center}
th{background:var(--head);color:var(--headtxt);font-size:15px;padding:10px 2px;position:sticky;top:0;z-index:2}
td.d{width:54px;font-size:16px;font-weight:600;padding:8px 2px}
td input{width:100%;border:0;background:transparent;color:var(--ink);font-size:16px;text-align:center;padding:10px 2px;font-family:inherit;border-radius:0}
td input:focus{outline:2px solid var(--ink);outline-offset:-2px;background:var(--card)}
tr.today td{background:var(--today)}
.p{color:var(--paytm)}.c{color:var(--cash)}.k{color:var(--kharcha)}
tr.total td{background:var(--tot);font-weight:700;font-size:16px;padding:12px 2px;position:sticky;bottom:0}
</style>
</head>
<body>
<div class="nav">
  <button id="prev" aria-label="અગાઉનો મહિનો">‹</button>
  <h1 id="title"></h1>
  <button id="next" aria-label="પછીનો મહિનો">›</button>
</div>
<div class="wrap">
  <table>
    <thead><tr><th>તારીખ</th><th>પેટીએમ</th><th>રોકડા</th><th>ખર્ચ</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
<script>
const KEY='hisab_v2';
const MONTHS=['જાન્યુઆરી','ફેબ્રુઆરી','માર્ચ','એપ્રિલ','મે','જૂન','જુલાઈ','ઓગસ્ટ','સપ્ટેમ્બર','ઓક્ટોબર','નવેમ્બર','ડિસેમ્બર'];
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function store(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
const fmt=n=>(Math.round(n*100)/100).toString();
let year=new Date().getFullYear(), month=new Date().getMonth();

function render(){
  const mk=year+'-'+String(month+1).padStart(2,'0');
  $('title').textContent=MONTHS[month]+' '+year;
  const data=load()[mk]||{};
  const days=new Date(year,month+1,0).getDate();
  const t=new Date(), isNow=t.getFullYear()===year&&t.getMonth()===month;
  let h='';
  for(let d=1;d<=days;d++){
    const e=data[d]||{};
    h+='<tr'+(isNow&&t.getDate()===d?' class="today"':'')+'><td class="d">'+d+'</td>'+
      ['p','c','k'].map(f=>'<td><input class="'+f+'" type="number" inputmode="decimal" data-d="'+d+'" data-f="'+f+'" value="'+(e[f]??'')+'"></td>').join('')+'</tr>';
  }
  h+='<tr class="total"><td>કુલ</td><td class="p" id="tp"></td><td class="c" id="tc"></td><td class="k" id="tk"></td></tr>';
  $('body').innerHTML=h;
  totals();
  document.querySelectorAll('#body input').forEach(i=>i.addEventListener('input',()=>{
    const all=load();
    all[mk]=all[mk]||{};
    const d=i.dataset.d;
    all[mk][d]=all[mk][d]||{};
    if(i.value==='')delete all[mk][d][i.dataset.f];else all[mk][d][i.dataset.f]=+i.value;
    store(all);totals();
  }));
}
function totals(){
  const mk=year+'-'+String(month+1).padStart(2,'0');
  const data=load()[mk]||{};
  let p=0,c=0,k=0;
  Object.values(data).forEach(e=>{p+=e.p||0;c+=e.c||0;k+=e.k||0});
  $('tp').textContent=fmt(p);$('tc').textContent=fmt(c);$('tk').textContent=fmt(k);
}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};
$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};
render();
</script>
</body>
</html>
